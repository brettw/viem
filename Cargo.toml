[package]
name = "viem-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/core/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.140"
html5ever = "=0.39.0"
regex = "1.11"
regex-automata = "=0.4.18"
regex-syntax = "=0.8.11"
unicode-segmentation = "=1.12.0"
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["hardcoded-data"] }
# Grammar changes also require package/catalogue and filename-rule review; see
# src/core/document/syntax/treesitter/PROFILE.md and detection/PROFILE.md beside it.
tree-sitter = "=0.25.10"
tree-sitter-c = "=0.23.4"
tree-sitter-cpp = "=0.23.4"
tree-sitter-rust = "=0.23.2"
tree-sitter-swift = "=0.7.3"
tree-sitter-objc = "=3.0.2"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-javascript = "=0.23.1"
tree-sitter-typescript = "=0.23.2"
tree-sitter-python = "=0.23.5"
tree-sitter-json = "=0.24.8"
unicode-width = "=0.1.14"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]

# The suite exercises multi-megabyte documents and million-line fixtures. Keep
# debug assertions and overflow checks while avoiding unoptimized fixture work.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
# Keep debug info in split objects, as macOS does by default, rather than
# linking a copy of the core's debug info into each test executable.
split-debuginfo = "unpacked"

# Swift integration tests exercise the same large-document paths through the C
# ABI. Keep their archive separate from the ordinary unoptimized debug app,
# with the same optimization, assertions and overflow checks as Rust tests.
[profile.native-test]
inherits = "test"
# Keep source-line backtraces without making every Swift relink collect the
# entire core's variable/type debug information. Ordinary debug builds retain it.
debug = "line-tables-only"
